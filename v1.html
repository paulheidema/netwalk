<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="theme-color" content="#ffffff">
<title>NetWalk · Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--ink:#111;--muted:#444;--line:#e3e3e3;--accent:#0b5e52}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--ink);font:19px/1.4 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 40px)}
  main{max-width:480px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .top h1{font-size:26px;margin:0}
  .top a{color:var(--accent);font-size:17px;font-weight:600;text-decoration:none}
  .hero{text-align:center;padding:10px 0 4px}
  .gauge{position:relative;width:220px;height:220px;margin:0 auto}
  .gauge svg{width:100%;height:100%;transform:rotate(-225deg)}
  .gauge .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .num b{font-size:60px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
  .gauge .num span{font-size:24px;font-weight:700;margin-top:6px}
  .status{font-size:18px;color:var(--muted);margin:6px 0 16px}
  .go{width:100%;border:0;border-radius:16px;padding:20px;font:700 22px -apple-system,system-ui;background:var(--accent);color:#fff}
  .go.stop{background:#111}
  .list{margin-top:24px;border-top:1px solid var(--line)}
  .list div{display:flex;justify-content:space-between;align-items:baseline;padding:16px 2px;border-bottom:1px solid var(--line);font-size:20px}
  .list b{font-size:26px;font-variant-numeric:tabular-nums}
  h2{font-size:22px;margin:30px 0 10px}
  .spark{width:100%;height:70px;display:block}
  .seg{display:flex;gap:8px;margin-bottom:10px}
  .seg button{flex:1;border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:12px;padding:12px;font:700 18px -apple-system,system-ui}
  .seg button.on{background:var(--accent);color:#fff}
  #map{height:360px;border-radius:14px;z-index:0}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:16px;margin-top:12px}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-1px}
  .note{font-size:17px;color:var(--muted)}
  details{margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
  details summary{font-size:20px;font-weight:700;cursor:pointer}
  .nw-panel{font-size:16px}
</style>
</head>
<body>
<main>
  <div class="top"><h1>Dashboard</h1><a href="./">Back</a></div>

  <section class="hero">
    <div class="gauge">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="none" stroke="#eee" stroke-width="13" stroke-dasharray="235.6 314.2" stroke-linecap="round"/>
        <circle id="arc" cx="60" cy="60" r="50" fill="none" stroke="#ccc" stroke-width="13" stroke-dasharray="0 314.2" stroke-linecap="round" style="transition:stroke-dasharray .6s,stroke .6s"/></svg>
      <div class="num"><b id="score">—</b><span id="band">Strength</span></div>
    </div>
    <div class="status" id="status">Tap Start, then walk.</div>
    <button class="go" id="go">Start</button>
  </section>

  <div class="list">
    <div><span>Speed</span><b id="dl">—</b></div>
    <div><span>Ping</span><b id="rtt">—</b></div>
    <div><span>Reliable</span><b id="rel">—</b></div>
    <div><span>Dropouts (5 min)</span><b id="drops">—</b></div>
    <div><span>GPS</span><b id="gps" style="font-size:20px">Off</b></div>
  </div>

  <h2>Recent readings</h2>
  <svg class="spark" id="spark" viewBox="0 0 300 70" preserveAspectRatio="none"></svg>
  <div class="note" id="sparkinfo"></div>

  <h2>Map</h2>
  <div class="seg" id="mapseg">
    <button class="on" data-v="trail">Today</button>
    <button data-v="zones">All zones</button>
  </div>
  <div id="map"></div>
  <div class="legend" id="legend"></div>

  <details><summary>Settings</summary><div id="panel"></div>
    <p class="note">iPhones don't show signal bars to web pages, so strength is worked out from speed, ping and dropouts.</p>
  </details>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="core.js"></script>
<script src="ui.js"></script>
<script>
const C = NetCore, U = NetUI, $ = id => document.getElementById(id);
let view = 'trail';

const map = L.map('map', { zoomControl: false }).setView(C.ROSEAU, 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
const layer = L.layerGroup().addTo(map);
const me = L.circleMarker(C.ROSEAU, { radius: 9, color: '#fff', weight: 3, fillColor: '#2b6fff', fillOpacity: 1 });
let fitted = false;

document.querySelectorAll('#mapseg button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#mapseg button').forEach(x => x.classList.toggle('on', x === b));
  view = b.dataset.v; drawMap(true);
});
$('legend').innerHTML = C.BANDS.map(b => `<span><i style="background:${b.color}"></i>${b.label}</span>`).join('');

function drawMap(fit) {
  layer.clearLayers();
  const all = C.samples();
  let pts;
  if (view === 'trail') {
    pts = C.filterRange(all, 'today').filter(s => s.lat != null);
    if (!pts.length) pts = all.filter(s => s.lat != null).slice(-400);
    pts.forEach(s => {
      const b = C.band(s.score);
      L.circleMarker([s.lat, s.lon], { radius: 7, stroke: false, fillColor: b.color, fillOpacity: .9 })
        .bindPopup(`<b style="color:${b.color}">${b.label}</b><br>${U.fmt.time(s.t)} · ping ${U.fmt.ms(s.rtt)}${s.dl != null ? ' · ' + U.fmt.mbps(s.dl) : ''}`).addTo(layer);
    });
  } else {
    const zones = C.hexZones(all, 45, 'overall');
    zones.forEach(z => {
      const b = C.band(z.value);
      L.polygon(z.corners, { color: b.color, weight: 1, fillColor: b.color, fillOpacity: .3 + .45 * z.confidence }).bindPopup(U.zonePopup(z)).addTo(layer);
    });
    pts = zones.map(z => ({ lat: z.center[0], lon: z.center[1] }));
  }
  if ((fit || !fitted) && pts.length) { map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lon])).pad(.15)); fitted = true; }
}

function setGauge(score) {
  const b = C.band(score);
  $('arc').setAttribute('stroke-dasharray', `${235.6 * score / 100} 314.2`); $('arc').setAttribute('stroke', b.color);
  $('score').textContent = score; $('band').textContent = b.label; $('band').style.color = b.color;
}

function render(s) {
  setGauge(s.score);
  $('dl').textContent = U.fmt.mbps(C.state.lastDl);
  $('rtt').textContent = U.fmt.ms(s.rtt);
  const rel = C.reliabilityNow();
  $('rel').textContent = U.fmt.pct(rel); $('rel').style.color = C.band(rel ?? 0).color;
  $('drops').textContent = C.samples().filter(x => !x.demo && x.t > Date.now() - 300000 && x.loss >= 1).length;
  spark();
}

function spark() {
  const list = C.samples().filter(s => !s.demo).slice(-30);
  const svg = $('spark'); svg.innerHTML = '';
  if (!list.length) { $('sparkinfo').textContent = 'No readings yet.'; return; }
  const w = 300 / 30;
  list.forEach((s, i) => {
    const h = Math.max(4, s.score / 100 * 66);
    svg.insertAdjacentHTML('beforeend', `<rect x="${i * w + 1}" y="${70 - h}" width="${w - 2}" height="${h}" rx="2" fill="${C.band(s.score).color}"/>`);
  });
  $('sparkinfo').textContent = `Taller = better. Since ${U.fmt.time(list[0].t)}.`;
}

C.on('sample', s => { render(s); drawMap(false); });
C.on('status', t => $('status').textContent = t === 'Measuring' ? 'Measuring as you walk…' : t);
C.on('position', p => {
  if (p) {
    $('gps').textContent = `±${Math.round(p.acc)} m`;
    me.setLatLng([p.lat, p.lon]).addTo(map);
    if (!fitted) { map.setView([p.lat, p.lon], 16); fitted = true; }
  } else $('gps').textContent = C.state.posErr ? 'Not allowed' : 'Waiting…';
});
C.on('running', on => { $('go').textContent = on ? 'Stop' : 'Start'; $('go').classList.toggle('stop', on); if (!on) $('gps').textContent = 'Off'; });
$('go').onclick = () => C.state.running ? C.stop() : C.start();

$('panel').append(U.dataPanel(() => { drawMap(true); spark(); }));
const last = C.samples().filter(s => !s.demo).slice(-1)[0];
if (last) { setGauge(last.score); $('band').textContent = 'Last reading'; spark(); }
drawMap(true);
</script>
</body>
</html>
